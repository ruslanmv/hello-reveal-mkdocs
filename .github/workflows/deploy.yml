name: Docs & Slides Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**/*.md'
      - 'scripts/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.x"
      HTML_OUT: "docs/slides/watsonx-agentic-ai.html"
      PDF_OUT: "docs/slides/watsonx-agentic-ai.pdf"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Pages
        uses: actions/configure-pages@v5

      # Generate HTML slides with Pandoc
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Generate Reveal.js HTML
        run: bash scripts/generate_slides.sh

      # Generate PDF with DeckTape (Docker)
      - name: Generate PDF
        run: |
          docker --version
          docker run --rm -t                 -v "$PWD":/slides                 astefanutti/decktape                 --size 1920x1080                 --slides 1-                 "file:///slides/${HTML_OUT}?print-pdf"                 "/slides/${PDF_OUT}"

      # Build MkDocs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install MkDocs + Material
        run: pip install --upgrade pip && pip install mkdocs mkdocs-material

      - name: Build MkDocs site
        run: mkdocs build --strict

      # Upload static site artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
