name: Build & Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build site, slides & PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # --- Slides (Pandoc) ---
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Generate Reveal.js HTML slides
        run: bash scripts/generate_slides.sh

      # --- PDF (DeckTape via Docker) ---
      - name: Export PDF with DeckTape (ALL slides)
        run: |
          mkdir -p docs/slides
          uid="$(id -u)"; gid="$(id -g)"
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Exporting ALL slides to PDF with extended timing..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          docker run --rm -t \
            -u "${uid}:${gid}" \
            --shm-size=2g \
            -e HOME=/tmp \
            -v "$PWD":/work \
            astefanutti/decktape \
            reveal \
            --size 1920x1080 \
            --slides 1-100 \
            --load-pause 8000 \
            --pause 2000 \
            --chrome-arg=--no-sandbox \
            --chrome-arg=--disable-setuid-sandbox \
            --chrome-arg=--disable-dev-shm-usage \
            --chrome-arg=--disable-gpu \
            --chrome-arg=--hide-scrollbars \
            --chrome-arg=--mute-audio \
            --chrome-arg=--disable-background-timer-throttling \
            --chrome-arg=--disable-renderer-backgrounding \
            --chrome-arg=--disable-backgrounding-occluded-windows \
            --chrome-arg=--user-data-dir=/tmp/chrome-user \
            --chrome-arg=--crash-dumps-dir=/tmp \
            --chrome-arg=--allow-file-access-from-files \
            --chrome-arg=--disable-web-security \
            --chrome-arg=--autoplay-policy=no-user-gesture-required \
            "file:///work/docs/slides/watsonx-agentic-ai.html" \
            "/work/docs/slides/watsonx-agentic-ai.pdf"
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # Verify PDF was created with multiple pages
      - name: Verify PDF
        run: |
          if [ ! -f "docs/slides/watsonx-agentic-ai.pdf" ]; then
            echo "❌ ERROR: PDF file not found!"
            exit 1
          fi
          
          PDF_SIZE=$(stat -c%s "docs/slides/watsonx-agentic-ai.pdf")
          echo "📄 PDF size: ${PDF_SIZE} bytes"
          
          if [ "${PDF_SIZE}" -lt 100000 ]; then
            echo "⚠️  WARNING: PDF is small (${PDF_SIZE} bytes)"
            echo "   This might mean only 1 page was captured"
          else
            echo "✅ PDF size looks good"
          fi

      # --- MkDocs (via uv) ---
      - name: Install uv (Python env)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python 3.11 and deps
        run: |
          uv python install 3.11
          uv sync

      - name: Build MkDocs site
        run: uv run mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4